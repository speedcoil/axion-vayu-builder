name: Build AxionOS for vayu

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Axion variant (va, pico, core, gms)'
        required: true
        default: va
        type: choice
        options: [va, pico, core, gms]

permissions:
  contents: read

jobs:
  build:
    # Standard ubuntu-24.04 has only ~14 GB disk. Set AXION_RUNNER to a
    # GitHub-hosted larger runner label with >= 250 GB free disk for full builds.
    runs-on: ${{ vars.AXION_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      WORKDIR: ${{ github.workspace }}/android
      VAYU_VENDOR_REPO: ${{ vars.VAYU_VENDOR_REPO }}
      COMMON_VENDOR_REPO: ${{ vars.COMMON_VENDOR_REPO }}
      VAYU_VENDOR_BRANCH: ${{ vars.VAYU_VENDOR_BRANCH || 'lineage-23.2' }}
      COMMON_VENDOR_BRANCH: ${{ vars.COMMON_VENDOR_BRANCH || 'lineage-23.2' }}
      GH_TOKEN: ${{ secrets.VENDOR_TOKEN || github.token }}
      VARIANT: ${{ inputs.variant }}

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Validate runner resources and vendor configuration
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          free -h
          free_gb=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          if (( free_gb < 250 )); then
            echo '::error::A full Android ROM build needs substantially more free space. Standard ubuntu-24.04 offers about 14 GB. Configure AXION_RUNNER with a larger GitHub-hosted runner label.'
            exit 1
          fi
          if [[ -z "$VAYU_VENDOR_REPO" || -z "$COMMON_VENDOR_REPO" ]]; then
            echo '::error::Set VAYU_VENDOR_REPO and COMMON_VENDOR_REPO repository variables first.'
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs gh curl wget ca-certificates \
            build-essential bc bison flex g++-multilib gcc-multilib \
            libssl-dev libelf-dev libxml2 libxml2-utils liblz4-tool \
            libncurses-dev lzop pngcrush rsync schedtool \
            squashfs-tools unzip zip zlib1g-dev python3 python-is-python3 \
            openjdk-21-jdk
          git lfs install
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync AxionOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          "$HOME/bin/repo" init -u https://github.com/AxionAOSP/android.git -b lineage-23.2 --git-lfs
          "$HOME/bin/repo" sync -c --no-tags -j4

      - name: Clone vayu device and vendor repositories
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          clone_if_missing() {
            local source="$1" path="$2" branch="$3"
            if [[ -d "$path" ]]; then
              echo "Found $path; keeping already-synced copy"
            else
              mkdir -p "$(dirname "$path")"
              gh repo clone "$source" "$path" -- --branch "$branch" --single-branch
            fi
          }
          clone_if_missing LineageOS/android_device_xiaomi_vayu device/xiaomi/vayu lineage-23.2
          clone_if_missing LineageOS/android_device_xiaomi_sm8150-common device/xiaomi/sm8150-common lineage-23.2
          clone_if_missing LineageOS/android_kernel_xiaomi_sm8150 kernel/xiaomi/sm8150 lineage-23.2
          clone_if_missing LineageOS/android_hardware_xiaomi hardware/xiaomi lineage-23.2
          clone_if_missing "$VAYU_VENDOR_REPO" vendor/xiaomi/vayu "$VAYU_VENDOR_BRANCH"
          clone_if_missing "$COMMON_VENDOR_REPO" vendor/xiaomi/sm8150-common "$COMMON_VENDOR_BRANCH"
          test -f vendor/xiaomi/vayu/BoardConfigVendor.mk
          test -f vendor/xiaomi/sm8150-common/BoardConfigVendor.mk
          test -f kernel/xiaomi/sm8150/arch/arm64/configs/vendor/xiaomi/vayu.config

      - name: Configure and build ROM
        shell: bash
        run: |
          set -eo pipefail
          cd "$WORKDIR"
          # Axion requires this flag in the device product makefile.
          product_file=device/xiaomi/vayu/lineage_vayu.mk
          test -f "$product_file"
          if ! grep -q '^TARGET_DISABLE_EPPE[[:space:]]*:=' "$product_file"; then
            sed -i '1i TARGET_DISABLE_EPPE := true' "$product_file"
          fi
          export USE_CCACHE=0
          export BUILD_USERNAME=github-actions
          export BUILD_HOSTNAME=github
          source build/envsetup.sh
          gk -s
          axion vayu userdebug "$VARIANT"
          ax -br -j4 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload ROM ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: axion-vayu-${{ inputs.variant }}
          path: android/out/target/product/vayu/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axion-vayu-build-log
          path: build.log
          if-no-files-found: ignore
